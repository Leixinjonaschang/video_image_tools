[project]
name = "video-image-tools"
version = "0.1.0"
description = "Tools for turning robot videos into paper figures, e.g. multi-exposure motion trails"
requires-python = ">=3.13"
dependencies = [
    "imageio-ffmpeg>=0.6.0",
    "numpy>=2.5.3",
    "opencv-python>=5.0.0.93",
]

[project.scripts]
motion-trail = "motion_trail.cli:main"

[project.optional-dependencies]
sam = [
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "transformers>=5.18.0",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "motion_trail"
